; Benchmark baseline: transaction pooling with the same server pool size as
; the gateway (32), and protocol-level prepared statements so agents use the
; same extended-protocol path the gateway does.
[databases]
swarmpg = host=pg-upstream port=5432 dbname=swarmpg

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 32
max_client_conn = 20000
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
