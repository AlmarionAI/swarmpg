name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks run this workflow too.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: make test

  e2e-stock:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: swarmpg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/swarmpg?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/schema.sql
      - run: AGENTS=1000 REQUESTS=8 scripts/e2e.sh
      - name: coordination failure workload on stock PostgreSQL
        run: |
          for workers in 100 1000; do
            COORD_DB_MODE=docker COORD_PG_IMAGE=postgres:17 COORD_WORKERS="$workers" \
              COORD_REPORT_DIR="$GITHUB_WORKSPACE/.coord-test/stock-$workers" \
              scripts/coordination-e2e.sh
          done
      - name: docs run as written
        run: |
          .bin/gateway &
          for i in $(seq 1 50); do curl -sf -o /dev/null localhost:8080/healthz && break; sleep 0.2; done
          scripts/check-docs.sh README.md docs/getting-started.md docs/gateway.md docs/tasks.md docs/outbox.md
      - name: outbox crash recovery on stock PostgreSQL
        run: |
          COORD_DB_MODE=docker COORD_PG_IMAGE=postgres:17 \
            COORD_REPORT_DIR="$GITHUB_WORKSPACE/.coord-test/outbox-stock" \
            scripts/outbox-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-stock
          include-hidden-files: true
          path: |
            .coord-test/stock-*/report.json
            .coord-test/stock-*/*.log
            .coord-test/outbox-stock/report.json
            .coord-test/outbox-stock/*.log

  kernel:
    runs-on: ubuntu-latest
    env:
      SWARMPG_SRC: ${{ github.workspace }}/swarmpg-core
      PREFIX: ${{ github.workspace }}/.pginstall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: sudo apt-get update && sudo apt-get install -y bison flex libreadline-dev zlib1g-dev
      - run: kernel/build.sh fetch
      - run: kernel/build.sh build
      - run: echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - run: kernel/build.sh check
      - if: failure()
        run: cat swarmpg-core/src/test/regress/regression.diffs || true
      - name: e2e on the kernel, including kernel probes
        run: make e2e KERNEL=1 AGENTS=1000 REQUESTS=8
      - name: coordination failure workload on the signed kernel
        run: |
          for workers in 100 1000; do
            KERNEL=1 PG_BIN_DIR="$PREFIX/bin" COORD_WORKERS="$workers" \
              COORD_REPORT_DIR="$GITHUB_WORKSPACE/.coord-test/kernel-$workers" \
              scripts/coordination-e2e.sh
          done
      - name: outbox crash recovery on the signed kernel
        run: |
          KERNEL=1 PG_BIN_DIR="$PREFIX/bin" \
            COORD_REPORT_DIR="$GITHUB_WORKSPACE/.coord-test/outbox-kernel" \
            scripts/outbox-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-kernel
          include-hidden-files: true
          path: |
            .coord-test/kernel-*/report.json
            .coord-test/kernel-*/*.log
            .coord-test/outbox-kernel/report.json
            .coord-test/outbox-kernel/*.log
